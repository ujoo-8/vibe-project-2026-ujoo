<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notice | FLATTEN</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="../css/notice.css" />
  </head>
  <body data-page="list">
    <main class="notice-page">
      <div class="container">
        <div class="notice-hero">
          <h1>Notice</h1>
          <p>FLATTEN의 새로운 소식과 유용한 정보를 확인해보세요.</p>
        </div>

        <div class="list-toolbar">
          <p class="list-total">Total <strong id="total">0</strong></p>
          <form class="list-search" id="search-form" method="get" action="notice.html">
            <div class="select-wrap">
              <select name="category" class="select" aria-label="분류">
                <option value="">전체</option>
                <option value="공지사항">공지사항</option>
              </select>
            </div>
            <div class="search-box">
              <input type="search" name="q" placeholder="검색어를 입력하세요." aria-label="제목 검색" />
              <button type="submit" aria-label="검색">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
              </button>
            </div>
            <a href="notice-write.html" class="btn-primary btn-sm">글쓰기</a>
          </form>
        </div>

        <div class="notice-table" role="table" aria-label="공지사항 목록">
          <div class="notice-table__head" role="row">
            <span class="col-no">번호</span>
            <span class="col-title">제목</span>
            <span class="col-date">등록일</span>
            <span class="col-views">조회수</span>
          </div>
          <div id="rows"></div>
        </div>

        <nav class="pager" id="pagination" aria-label="페이지 이동"></nav>
      </div>
    </main>
    <script src="../js/notice.js"></script>
  </body>
</html>
